[project]
name = "ptcgp-auto"
version = "2.0.0"
description = "自动连接 bluestack air虚拟机 自动对战/领取礼物、奖励/管理账号/自动开免费包"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
  "coremltools>=9.0",
  "fastapi>=0.135.2",
  "loguru>=0.7.0",
  "numpy>=2.4.4",
  "opencv-python>=4.13.0.92",
  "pillow>=12.1.1",
  "python-multipart>=0.0.27",
  "pyobjc-framework-vision>=10.0",
  "scipy>=1.17.1",
  "sqlmodel>=0.0.37",
  "uiautomator2>=3.5.0",
  "ultralytics>=8.4.33",
  "uvicorn>=0.42.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=9.0.2", "vulture>=2.16"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ptcgp_auto", "ptcgp_auto.*", "ptcgp_auto_v2", "ptcgp_auto_v2.*"]

[tool.ruff]
extend-exclude = [".venv", "node_modules"]

[tool.ruff.lint]
select = ["F"]

[tool.vulture]
paths = [
  "src",
  "main.py",
  "main_v2.py",
  "debug_tool.py",
  "scripts",
  "yolo-card-training/scripts",
]
exclude = ["*/.venv/*", "*/node_modules/*", "*/db/models/*"]
ignore_decorators = ["@TaskRegistry.register", "@router.*", "@app.*"]
min_confidence = 60
ignore_names = ["_handle_*", "action_*", "pytest_*"]

[tool.pytest.ini_options]
# 只收集明确的 tests/ 目录下的测试，避免 scripts/ 等目录里
# 以 test_ 开头的脚本被 pytest 误当成测试文件。
testpaths = ["src/ptcgp_auto_v2/tests", "src/ptcgp_auto_v2/web/tests"]

# 仅识别符合 pytest 默认命名约定的测试文件。
python_files = ["test_*.py", "*_test.py"]

markers = [
  "e2e_core: deterministic e2e scenarios without real emulator dependency",
  "e2e_device: real-emulator e2e scenarios for runtime recovery verification",
]
filterwarnings = [
  "ignore:Support for class-based `config` is deprecated, use ConfigDict instead\\.:pydantic.warnings.PydanticDeprecatedSince20",
]
