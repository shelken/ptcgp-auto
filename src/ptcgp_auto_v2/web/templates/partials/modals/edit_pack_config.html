<div class="space-y-6">
    <div class="flex justify-between items-center border-b-4 border-theme pb-4">
        <h3 class="text-2xl font-bold uppercase">{{ t.title_pack_config or 'Pack Configuration' }}</h3>
        <button onclick="closeModal()" class="text-xl font-bold hover:opacity-50">✕</button>
    </div>

    <form hx-post="/api/accounts/{{ account_id }}/pack-config?lang={{ current_lang }}"
          hx-target="#management-content"
          hx-on:htmx:after-request="if(event.detail.successful) closeModal()"
          class="space-y-6">
          
    <script>
        // Init custom selects for this modal
        if (typeof initCustomSelects === 'function') {
            initCustomSelects(document.getElementById('modal-content'));
        }
    </script>

        <!-- Target Series (Pack Code) -->
        <div class="space-y-2">
            <label class="block font-bold uppercase tracking-widest text-sm text-muted">{{ t.label_target_series or 'Target Series' }}</label>
            <div class="relative">
                <select name="pack_code"
                        class="js-custom-select brutal-input w-full"
                        hx-get="/partials/boosters-options"
                        hx-target="#booster-select"
                        hx-trigger="change"
                        hx-on:htmx:after-request="event.stopPropagation()">
                    <option value="">{{ t.label_select_series or '-- Select Series --' }}</option>
                    {% for set in card_sets %}
                    <option value="{{ set.code }}" {% if config and config.pack_code == set.code %}selected{% endif %}>
                        {{ set.name }} ({{ set.code }})
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <!-- Target Booster (Booster Name) -->
        <div class="space-y-2">
            <label class="block font-bold uppercase tracking-widest text-sm text-muted">{{ t.label_target_booster or 'Target Booster' }}</label>
            <div class="relative">
                <select id="booster-select" name="booster_name"
                        class="js-custom-select brutal-input w-full">
                    <option value="">{{ t.label_select_booster or '-- Select Booster --' }}</option>
                    {% for booster in current_boosters %}
                    <option value="{{ booster }}" {% if config and config.booster_name == booster %}selected{% endif %}>
                        {{ booster }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="text-xs text-muted">
            {{ t.desc_pack_config or 'Select the target card pack series and specific booster you want this account to prioritize opening.' }}
        </div>

        <!-- Actions -->
        <div class="flex justify-end gap-4 pt-4 border-t-2 border-subtle-light">
            <button type="button" onclick="closeModal()" class="brutal-btn">{{ t.label_cancel or 'Cancel' }}</button>
            <button type="submit" class="brutal-btn active">{{ t.label_save or 'Save Configuration' }}</button>
        </div>
    </form>
</div>
