{#
  通知面板内容模板
  Notification Panel Content Template
  Provides: 标题栏 + 内容区（通知列表）
#}

<!-- 通知面板标题栏 -->
<div class="notification-drawer__header">
    <h2 class="notification-drawer__title">{{ t.notification_center or '通知中心' }}</h2>
    <div class="notification-drawer__actions">
        <button
            type="button"
            id="mark-all-read-btn"
            class="brutal-btn brutal-btn--sm notification-drawer__mark-all"
            data-action="mark-all-notifications-read"
            {% if unread_count is not defined or unread_count == 0 %}disabled{% endif %}
            hx-post="/notifications/panel/mark-all-read?lang={{ current_lang }}"
            hx-trigger="click"
            hx-target="#notification-list-content"
            hx-swap="innerHTML"
            aria-label="{{ t.btn_mark_all_read or '全部已读' }}">
            {{ t.btn_mark_all_read or '全部已读' }}
        </button>
        <button
            type="button"
            class="notification-drawer__close"
            data-action="close-notification-panel"
            aria-label="{{ t.label_close or '关闭' }}">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
    </div>
</div>

<!-- 通知列表内容区 -->
<div id="notification-list-content"
     class="notification-drawer__content"
     hx-get="/notifications/panel?lang={{ current_lang }}"
     hx-trigger="loadPanel"
     hx-target="this"
     hx-swap="innerHTML"
     data-relative-locale="{{ current_lang }}"
     data-relative-just-now="{{ t.relative_just_now or '刚刚' }}"
     data-relative-soon="{{ t.relative_soon or '马上' }}"
     data-relative-minutes="{{ t.relative_minutes or '分钟' }}"
     data-relative-hours="{{ t.relative_hours or '小时' }}"
     data-relative-days="{{ t.relative_days or '天' }}"
     data-relative-ago="{{ t.relative_ago or '前' }}"
     data-relative-in="{{ t.relative_in or '后' }}">

    <!-- 初始骨架屏状态 -->
    <div class="notification-skeleton">
        <div class="skeleton-line skeleton-line--w75"></div>
        <div class="skeleton-line skeleton-line--w50"></div>
    </div>
    <div class="notification-skeleton">
        <div class="skeleton-line skeleton-line--w75"></div>
        <div class="skeleton-line skeleton-line--w50"></div>
    </div>
    <div class="notification-skeleton">
        <div class="skeleton-line skeleton-line--w75"></div>
        <div class="skeleton-line skeleton-line--w50"></div>
    </div>
</div>
