{# Modal 宏组件 #}
{# 提供统一的 Modal 头部、底部和容器结构 #}

{% macro modal_header(title, t) %}
<div class="flex justify-between items-center border-b-4 border-theme pb-4 mb-6">
    <h3 class="text-2xl font-bold uppercase">{{ title }}</h3>
    <button type="button" onclick="closeModal()" class="text-xl font-bold hover:opacity-50 transition-opacity" aria-label="{{ t.label_close or 'Close' }}">✕</button>
</div>
{% endmacro %}

{% macro modal_footer(t) %}
<div class="flex justify-end gap-4 pt-4 border-t-2 border-subtle-light mt-6">
    <button type="button" onclick="closeModal()" class="brutal-btn">{{ t.label_cancel or 'Cancel' }}</button>
    <button type="submit" class="brutal-btn active">{{ t.label_save or 'Save' }}</button>
</div>
{% endmacro %}

{% macro modal_container() %}
<div id="modal-content" class="bg-surface p-6 brutal-border w-full max-w-4xl max-h-[90vh] overflow-y-auto relative" role="dialog" aria-modal="true">
    {{ caller() }}
</div>
{% endmacro %}
