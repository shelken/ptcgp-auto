<div class="owned-stats-bar brutal-card">
    <div class="owned-stat-chip owned-stat-chip--primary">
        <span class="owned-stat-label">{{ t.owned_filtered_cards_label }}</span>
        <span class="owned-stat-value">{{ filtered_cards_count }}</span>
    </div>

    {% for item in rarity_progress %}
    <div class="owned-stat-chip">
        <span class="owned-stat-label">{{ item.rarity|rarity_display(current_lang) }}</span>
        <span class="owned-stat-value">{{ item.owned_count }}/{{ item.total_count }}</span>
    </div>
    {% endfor %}
</div>
