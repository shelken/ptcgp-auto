{#
  通知面板列表内容（不含标题栏）
  用于 HTMX 动态加载
#}

{% if notifications %}
    {% include "partials/notification_list_items.html" %}
{% else %}
    <div class="notification-empty-state">
        <div class="text-muted text-center py-8">
            <svg class="notification-empty-icon" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <p class="mt-4">{{ t.notification_empty or '暂无通知' }}</p>
        </div>
    </div>
{% endif %}
