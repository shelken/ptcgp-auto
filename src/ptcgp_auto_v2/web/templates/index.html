<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t.app_title }}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <!-- Google Fonts: Space Grotesk -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #FDFBF7; /* Warm Off-white */
            --border-color: #000000;
            --shadow-color: #000000;
            --accent-color: #FF4D4D; /* Brutalist Red */
            --active-color: #32CD32; /* Lime Green */
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-color);
            color: #1a1a1a;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Soft Brutalism Component Styles */
        .brutal-card {
            background-color: #ffffff;
            border: 3px solid var(--border-color);
            box-shadow: 6px 6px 0px var(--shadow-color);
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        .brutal-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0px var(--shadow-color);
        }

        .brutal-border {
            border: 3px solid var(--border-color);
        }

        .brutal-tag {
            background-color: var(--border-color);
            color: #ffffff;
            padding: 4px 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: inline-block;
        }
        
        .brutal-btn {
            background-color: #ffffff;
            border: 2px solid var(--border-color);
            padding: 4px 12px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.1s;
        }
        
        .brutal-btn:hover {
            background-color: #f0f0f0;
            transform: translate(-1px, -1px);
            box-shadow: 2px 2px 0px var(--shadow-color);
        }
        
        .brutal-btn:active {
            transform: translate(0, 0);
            box-shadow: 0 0 0;
        }
        
        .brutal-btn.active {
            background-color: var(--border-color);
            color: #ffffff;
            box-shadow: inset 2px 2px 0px rgba(0,0,0,0.5);
            transform: translate(1px, 1px);
        }

        .brutal-separator {
            border-bottom: 3px solid var(--border-color);
        }

        /* Filter Checkbox Styling */
        .filter-checkbox:checked + label {
            background-color: var(--border-color);
            color: white;
            box-shadow: 4px 4px 0px var(--shadow-color);
            transform: translate(-2px, -2px);
        }
        
        .filter-label {
            display: inline-block; /* Fix for rendering */
            cursor: pointer;
            border: 2px solid var(--border-color);
            background-color: white;
            padding: 4px 12px;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.1s ease;
            user-select: none;
            margin-bottom: 0.5rem; /* Spacing */
        }
        
        .filter-label:hover {
            background-color: #f0f0f0;
        }

        /* Pack Layouts */
        .pack-grid {
            display: grid;
            gap: 1rem;
            width: 100%;
            justify-content: center;
            grid-template-columns: repeat(6, 1fr); /* Unified 6-column grid */
        }
        
        /* Base card sizing: all cards span 2 columns (1/3 of width) */
        .pack-grid > .card-item {
            grid-column: span 2;
        }

        /* 6 cards: 3 top, 3 bottom */
        /* Natural flow works: 2+2+2 = 6 cols */
        .layout-6 {
            /* No special rules needed */
        }

        /* 5 cards: 3 top, 2 bottom (centered) */
        .layout-5 > .card-item:nth-child(4) {
            grid-column: 2 / span 2; /* Start at col 2 (center-left) */
        }
        .layout-5 > .card-item:nth-child(5) {
            grid-column: 4 / span 2; /* Start at col 4 (center-right) */
        }

        /* 4 cards: 2 top, 2 bottom (centered) */
        .layout-4 > .card-item:nth-child(odd) {
            grid-column: 2 / span 2; /* Left column */
        }
        .layout-4 > .card-item:nth-child(even) {
            grid-column: 4 / span 2; /* Right column */
        }
        
        /* Mobile adjustments */
        @media (max-width: 768px) {
            .pack-grid {
                gap: 0.5rem; /* Reduce gap on mobile */
            }
            /* Keep the 6-column grid logic even on mobile to ensure size consistency */
            /* 4-cards will be centered (2 cols each, 1 col gap on sides) */
            /* 5-cards will be 3 top, 2 bottom centered */
        }
        
        /* Global Grid View Layout */
        /* Applied to #records-container when in Grid Mode */
        .view-grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            align-items: start;
        }
        
        @media (max-width: 1024px) {
            .view-grid-layout {
                grid-template-columns: 1fr; /* Fallback to single column on smaller screens */
            }
        }

        /* HTMX Indicator */
        .htmx-indicator {
            display: none;
            opacity: 0;
            transition: opacity 200ms ease-in;
        }
        .htmx-request .htmx-indicator {
            display: flex;
            opacity: 1;
        }

        /* Language Toggle */
        .lang-link {
            text-decoration: none;
            font-weight: bold;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .lang-link.active {
            opacity: 1;
            text-decoration: underline;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <header class="max-w-7xl mx-auto mb-8">
        <!-- Top Bar: Language & Version -->
        <div class="flex justify-between items-center mb-6">
            <div class="text-sm font-bold tracking-widest">
                <a href="javascript:void(0)" onclick="setLang('en')" class="lang-link {% if current_lang == 'en' %}active{% endif %}">EN</a>
                <span class="mx-2">/</span>
                <a href="javascript:void(0)" onclick="setLang('zh_CN')" class="lang-link {% if current_lang == 'zh_CN' %}active{% endif %}">中文</a>
            </div>
            <div class="flex gap-4">
                <div class="brutal-tag text-sm border-2 border-black bg-white !color-black !text-black">
                    V2.1.0
                </div>
                <div class="brutal-tag text-sm">
                    {{ t.live_tag }}
                </div>
            </div>
        </div>

        <div class="flex flex-col lg:flex-row justify-between items-end brutal-separator pb-6 gap-8">
            <!-- Title (Simplified) -->
            <div class="w-full lg:w-auto whitespace-nowrap">
                <h1 class="text-6xl md:text-8xl font-bold tracking-tighter leading-none mb-2">{{ t.header_title|safe }}</h1>
            </div>

            <!-- Filters Section (Right Aligned) -->
            <div class="w-full lg:w-auto lg:text-right">
                
                <!-- View Toggle & Clear Filters Row -->
                <div class="flex flex-wrap justify-between lg:justify-end items-center gap-4 mb-4">
                     <!-- View Mode -->
                    <div class="flex items-center gap-2">
                        <span class="font-bold uppercase tracking-widest text-sm opacity-60">{{ t.view_mode }}</span>
                        <button onclick="setViewMode('list')" id="btn-view-list" class="brutal-btn active">{{ t.view_list }}</button>
                        <button onclick="setViewMode('grid')" id="btn-view-grid" class="brutal-btn">{{ t.view_grid }}</button>
                    </div>

                    <!-- Clear Filters -->
                    <button onclick="clearFilters()" class="brutal-btn text-xs tracking-widest uppercase">
                        {{ t.clear_filters }} ✕
                    </button>
                </div>

                <form id="filter-form" 
                      hx-get="/api/records?page=0&lang={{ current_lang }}" 
                      hx-target="#records-container" 
                      hx-swap="innerHTML"
                      class="space-y-4"
                      onchange="saveFilters()">
                    
                    <!-- Rarity Filter -->
                    <div class="flex flex-col lg:items-end gap-2">
                        <span class="font-bold uppercase tracking-widest text-sm opacity-60">{{ t.filter_rarity }}</span>
                        <div class="flex flex-wrap gap-2 lg:justify-end">
                            {% for r in rarities %}
                            <div>
                                <input type="checkbox" id="rarity-{{ r }}" name="rarity" value="{{ r }}" class="hidden filter-checkbox"
                                       hx-get="/api/records?page=0&lang={{ current_lang }}" hx-target="#records-container" hx-include="#filter-form">
                                <label for="rarity-{{ r }}" class="filter-label">{{ t['rarity_' + r] or r }}</label>
                            </div>
                            {% endfor %}
                        </div>
                    </div>

                    <!-- Card Type Filter -->
                    <div class="flex flex-col lg:items-end gap-2">
                        <span class="font-bold uppercase tracking-widest text-sm opacity-60">{{ t.filter_type }}</span>
                        <div class="flex flex-wrap gap-2 lg:justify-end">
                            {% for type in card_types %}
                            <div>
                                <input type="checkbox" id="type-{{ type }}" name="card_type" value="{{ type }}" class="hidden filter-checkbox"
                                       hx-get="/api/records?page=0&lang={{ current_lang }}" hx-target="#records-container" hx-include="#filter-form">
                                <label for="type-{{ type }}" class="filter-label uppercase">{{ t['type_' + type] or type }}</label>
                            </div>
                            {% endfor %}
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto">
        <!-- Records Container -->
        <div id="records-container" 
             class="space-y-12"
             hx-get="/api/records?page=0&lang={{ current_lang }}" 
             hx-swap="innerHTML">
        </div>

        <!-- Loading Spinner -->
        <div class="htmx-indicator w-full justify-center items-center py-12">
            <div class="animate-spin w-12 h-12 border-4 border-black border-t-transparent rounded-full"></div>
            <span class="ml-4 font-bold text-xl">{{ t.loading_text }}</span>
        </div>
        
        <!-- End of List -->
        <div id="end-of-records" class="hidden text-center py-20">
            <div class="inline-block border-2 border-black px-8 py-4 font-bold text-xl bg-white shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
                {{ t.end_of_records }}
            </div>
        </div>
    </main>

    <footer class="max-w-7xl mx-auto mt-20 pt-8 border-t-4 border-black text-center font-bold uppercase tracking-widest text-sm">
        <p>{{ t.generated_by }}</p>
    </footer>
    
    <!-- Persistence Logic -->
    <script>
        // --- Constants ---
        const STORAGE_KEY_LANG = 'ptcgp_lang';
        const STORAGE_KEY_FILTERS = 'ptcgp_filters';
        const STORAGE_KEY_VIEW_MODE = 'ptcgp_view_mode';

        // --- Persistence Functions ---
        
        // 1. Language Persistence
        function setLang(lang) {
            localStorage.setItem(STORAGE_KEY_LANG, lang);
            const url = new URL(window.location);
            url.searchParams.set('lang', lang);
            window.location.href = url.toString();
        }

        (function initLang() {
            const urlParams = new URLSearchParams(window.location.search);
            const currentLang = urlParams.get('lang');
            const storedLang = localStorage.getItem(STORAGE_KEY_LANG);

            if (!currentLang && storedLang) {
                const url = new URL(window.location);
                url.searchParams.set('lang', storedLang);
                window.location.replace(url.toString());
            } else if (currentLang && currentLang !== storedLang) {
                localStorage.setItem(STORAGE_KEY_LANG, currentLang);
            }
        })();

        // 2. Filter Persistence
        function saveFilters() {
            const formData = new FormData(document.getElementById('filter-form'));
            const filters = {
                rarity: formData.getAll('rarity'),
                card_type: formData.getAll('card_type')
            };
            localStorage.setItem(STORAGE_KEY_FILTERS, JSON.stringify(filters));
        }

        function restoreFilters() {
            const stored = localStorage.getItem(STORAGE_KEY_FILTERS);
            let queryParts = [];

            if (stored) {
                try {
                    const filters = JSON.parse(stored);
                    if (filters.rarity) {
                        filters.rarity.forEach(val => {
                            const el = document.querySelector(`input[name="rarity"][value="${val}"]`);
                            if (el) el.checked = true;
                            queryParts.push(`rarity=${val}`);
                        });
                    }
                    if (filters.card_type) {
                        filters.card_type.forEach(val => {
                            const el = document.querySelector(`input[name="card_type"][value="${val}"]`);
                            if (el) el.checked = true;
                            queryParts.push(`card_type=${val}`);
                        });
                    }
                } catch (e) {
                    console.error("Failed to restore filters", e);
                }
            }

            // Always trigger initial load via JS, incorporating any restored filters
            const container = document.getElementById('records-container');
            const baseAttr = container.getAttribute('hx-get');
            let finalUrl = baseAttr;
            
            if (queryParts.length > 0) {
                finalUrl = baseAttr + '&' + queryParts.join('&');
                // Update attribute for infinite scroll to work correctly
                container.setAttribute('hx-get', finalUrl);
            }
            
            htmx.ajax('GET', finalUrl, {target: '#records-container', swap: 'innerHTML'});
        }
        
        // 3. View Mode Logic
        function setViewMode(mode) {
            const container = document.getElementById('records-container');
            const btnList = document.getElementById('btn-view-list');
            const btnGrid = document.getElementById('btn-view-grid');

            if (mode === 'grid') {
                container.classList.add('view-grid-layout');
                container.classList.remove('space-y-12'); // Remove vertical spacing in grid mode
                
                btnList.classList.remove('active');
                btnGrid.classList.add('active');
            } else {
                container.classList.remove('view-grid-layout');
                container.classList.add('space-y-12'); // Restore vertical spacing
                
                btnList.classList.add('active');
                btnGrid.classList.remove('active');
            }
            
            localStorage.setItem(STORAGE_KEY_VIEW_MODE, mode);
        }

        function restoreViewMode() {
            const mode = localStorage.getItem(STORAGE_KEY_VIEW_MODE) || 'list';
            setViewMode(mode);
        }

        function clearFilters() {
            document.querySelectorAll('.filter-checkbox').forEach(el => el.checked = false);
            localStorage.removeItem(STORAGE_KEY_FILTERS);
            htmx.ajax('GET', '/api/records?page=0&lang={{ current_lang }}', {target: '#records-container', swap: 'innerHTML'});
        }

        document.addEventListener('DOMContentLoaded', () => {
            restoreFilters();
            restoreViewMode();
        });
    </script>
</body>
</html>
