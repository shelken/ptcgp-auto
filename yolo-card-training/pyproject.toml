[project]
name = "yolo-card-training"
version = "0.1.0"
description = "YOLO 卡牌检测模型训练"
requires-python = ">=3.12"

dependencies = [
    "ultralytics>=8.4.33",
    "opencv-python>=4.13.0.92",
    "pillow>=12.1.1",
    "numpy>=2.4.4",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "loguru>=0.7.0",
    "coremltools>=9.0",
    "scipy>=1.17.1",
]

[tool.uv]
python-downloads = "never"
