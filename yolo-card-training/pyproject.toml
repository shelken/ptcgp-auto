[project]
name = "yolo-card-training"
version = "0.1.0"
description = "YOLO 卡牌检测模型训练"
requires-python = ">=3.12"

dependencies = [
    "ultralytics>=8.0.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "numpy>=1.14.5,<=2.3.5",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "adbutils>=2.0.0",
    "loguru>=0.7.0",
    "coremltools>=9.0",
]

[tool.uv]
python-downloads = "never"
